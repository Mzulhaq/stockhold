[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stockhold"
version = "0.1.0"
description = "Transactional inventory reservations with inspectable concurrency invariants."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.162,<1", "uvicorn>=0.54,<1", "sqlalchemy>=2.1,<3", "psycopg[binary]>=3.3,<4"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.17,<1", "httpx2>=2,<3", "build>=1.6,<2"]

[project.scripts]
stockhold = "stockhold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
