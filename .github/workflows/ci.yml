name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            database: sqlite
          - python: '3.13'
            database: sqlite
          - python: '3.11'
            database: postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stockhold
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: stockhold_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stockhold -d stockhold_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Test database integration
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://stockhold:ci-only-placeholder@localhost:5432/stockhold_test' || '' }}
        run: python -m pytest --cov=stockhold --cov-report=term-missing
      - run: python scripts/demo.py
      - run: python -m build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python scripts/demo.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t stockhold .
      - run: docker run --rm --network none stockhold
